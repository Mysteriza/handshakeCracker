name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        run: |
          LAST_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "v0.0.0")
          MAJOR_MINOR=$(echo "$LAST_TAG" | sed 's/v\([0-9]*\.[0-9]*\)\..*/\1/')
          [ -z "$MAJOR_MINOR" ] && MAJOR_MINOR="0.0"
          PATCH=$(git rev-list "${LAST_TAG}..HEAD" --count 2>/dev/null || echo "0")
          echo "VERSION=${MAJOR_MINOR}.${PATCH}" >> $GITHUB_ENV

      - name: Create & push tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -f "v${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}" --force

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --match 'v*' --abbrev=0 ${{ github.sha }} 2>/dev/null || echo "")
          {
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --oneline --no-decorate "${PREV_TAG}..${{ github.sha }}" 2>/dev/null | sed 's/^/- /'
            else
              git log --oneline --no-decorate "${{ github.sha }}" -10 | sed 's/^/- /'
            fi
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${{ env.VERSION }}"
          } > release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          body_path: release_body.md
